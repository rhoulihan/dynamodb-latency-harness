# conf/smoke.properties — throwaway rehearsal of the four-phase machine.
# NOT a measurement config. See conf/prod.properties for the real run.
#
# region and resultsDir below are sane standalone defaults so this file loads
# on its own. scripts/20-deploy.sh re-asserts region from $AWS_REGION and
# resultsDir, and appends s3Bucket, s3Prefix and checkpointFile -- all
# account- or run-specific values with no sensible value to check in.

table=latency-test-smoke
region=us-east-1
itemCount=16384
loadWcu=1000
readRcu=1000
resultsDir=/opt/ddblat/results

# --- SMOKE-ONLY TIMING OVERRIDES. Production uses warmSeconds=60,
# minRampMinutes=5, windowMinutes=20. ------------------------------------------
targetFraction=0.90
warmSeconds=30
minRampMinutes=1
windowMinutes=1

# --- client --------------------------------------------------------------------
initialThreads=8
maxThreads=64

selfStop=false
