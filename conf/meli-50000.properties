# conf/meli-50000.properties -- MELI PoC latency at 50000-byte items.
# Generated: request/call RATES are held constant across all five sizes so item size is the only
# variable. Capacity is derived from the rate, never the other way round.
#
#   strong GetItem      2400/s  x 13 RCU  -> readRcu  = 31200 / 0.9 = 34667
#   eventual GetItem    same readRcu -> 4800/s (half cost per read; as in every prior run)
#   PutItem (LOAD)      458/s   x 49 WCU  -> loadWcu  = 22442 / 0.9 = 24936   (~76 min)
#   BatchGetItem x100   24 calls/s = 2,400 items/s, paced on readRcu
#   BatchWriteItem x25  20 calls/s = 500 items/s x 49 WCU -> batchWriteWcu = 27223
#   TransactWrite x83   3 txn/s x 83 items x 49 WCU x 2 -> txnWcu = 27114
#
# presplitWcu=40000 fixes 40 partitions at every size, and reads use the same 15-of-40 segment
# slice as the 59 KiB runs -> 160 strong reads/s per partition at every size.
table=meli-50000b
region=us-east-1
itemCount=2097152
itemSize=50000

presplitWcu=40000
loadWcu=24936
readRcu=34667
targetFraction=0.9
readSegmentsTotal=40
readSegmentsUsed=15

batchOps=true
batchGetSize=100
batchWriteSize=25
txnItems=100
batchWriteWcu=27223
txnWcu=27114

warmSeconds=60
minRampMinutes=5
windowMinutes=20
initialThreads=32
maxThreads=256
resultsDir=/opt/ddblat/results
selfStop=true
