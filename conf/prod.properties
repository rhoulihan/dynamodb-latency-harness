# conf/prod.properties -- the measurement run. Spec section 2 (phase targets) and 6 (phase machine).
#
# region and resultsDir below are standalone defaults so this file loads on its own.
# scripts/20-deploy.sh re-asserts region and resultsDir and appends s3Bucket, s3Prefix and
# checkpointFile -- account- or run-specific values with no sensible value to check in.

table=latency-test-100g
region=us-east-1

# 2,097,152 x 60,416 bytes = 126,701,535,232 = exactly 118 GiB.
# Must be a power of two: the full-period read cycle requires it.
itemCount=2097152

# --- capacity -------------------------------------------------------------------
# Main creates the table at 10 RCU / presplitWcu WCU, drops to 10 RCU / loadWcu WCU for the
# LOAD test, switches to readRcu RCU / 10 WCU at SWITCH, and tears down to 10/10. The "10"
# side of every transition is compiled in. Created at RCU 10, not 40000: read capacity
# during a write-only phase costs ~$5/hr for nothing.
#
# Measured cause of the production run's write throttling (33 throttles, 792 retries,
# 2660/2968 ticks within 2% of target): NOT key skew (hottest partition only +1.03% above
# ideal across 40 partitions) but per-partition headroom. Creating directly at loadWcu=36000
# gave 40 partitions x 900 WCU/s driven against the 1,000 WCU/s hard limit -- 9% headroom,
# which any transient (an in-progress split, arrival jitter) tips over into a throttle.
#
# Partitions are allocated at CREATE time from provisioned capacity and never merge, so
# presplitWcu creates high (at the table-level quota ceiling -- cannot go higher) and then
# Main drops to loadWcu, keeping the partition count while lowering the per-partition rate:
#   create at presplitWcu=40000 -> 40 partitions (40000 / 1000).
#   load at 90% of loadWcu=30000 = 27,000 CU/s driven -> 675 WCU/s per partition
#   (27,000 / 40) against the 1,000 hard limit -- 32% headroom, versus 9% before.
# 118 GiB / 40 partitions = 2.95 GiB each, still far below the 10 GB partition limit.
#
# Every item now costs exactly 59 WCU (fixed 59 KiB size, no distribution to average):
# load = 2,097,152 x 59 = 123,731,968 WCU; at 90% of loadWcu=30,000 = 27,000 CU/s driven,
# that is 123,731,968 / 27,000 = 4,583s = ~76 min (was ~65 min against the smaller 100 GiB
# dataset). Read rates at 90% of readRcu=40,000 = 36,000 RCU/s driven: fixed 15 RCU/read
# strong -> 2,400 reads/s, fixed 7.5 RCU/read eventual -> 4,800 reads/s (was 2,770 / 5,540
# against the old 48-52 KiB size distribution).
presplitWcu=40000
loadWcu=30000
readRcu=40000
targetFraction=0.90

# --- read hash-range subsetting --------------------------------------------------
# Spreading readRcu evenly across the whole key space spreads it evenly across all ~40
# partitions too (DynamoDB hashes keys to partitions) -- 900 RCU/s per partition against the
# 3,000 RCU/s hard limit, only 30% utilisation. Restricting the *index* range does not fix
# this: any subset of indices still spreads uniformly across all 40 partitions (verified --
# hottest partition +1.03% for any subset). A parallel Scan's Segment/TotalSegments divides
# the table into equal, contiguous slices of the real hash key space, so segment i of N is a
# known slice of partitions, not a guess. See SegmentKeySelector.
#
# readSegmentsTotal=40 matches presplitWcu's ~40 partitions (40000 / 1000 WCU per partition
# at creation). Main runs the selector once before R-A/R-B and reads only that subset for
# both read phases:
#   readRcu x targetFraction / readSegmentsUsed = RCU/s per partition
#   40,000 x 0.90 / 15 = 36,000 / 15 = 2,400 RCU/s per partition -- 80% of the 3,000 RCU/s
#   limit, against ~786,432 keys (2,097,152 x 15 / 40).
#
# 15 was chosen, not fewer or more: below 12 segments the per-partition rate exceeds the
# 3,000 RCU/s hard limit (36,000 / 12 = 3,000 exactly, no headroom; 11 -> 3,273, over) and
# above 17 it falls under the 2,100 RCU/s floor (36,000 / 17 = 2,118; 18 -> 2,000, under).
readSegmentsTotal=40
readSegmentsUsed=15

# --- timing: Global Constraints, not smoke overrides ----------------------------
# minRampMinutes=5 is the JIT gate: the window must not open until compilation has
# quiesced, or the first samples are interpreted/C1 code and the tail is meaningless.
warmSeconds=60
minRampMinutes=5
windowMinutes=20

# --- client ----------------------------------------------------------------------
# ~28 in-flight requests saturate 90% of 40,000 RCU at the fixed 59 KiB item size; 32
# covers that with headroom, and the saturation detector can add threads up to 256 if it
# ever fires.
initialThreads=32
maxThreads=256

resultsDir=/opt/ddblat/results

# Stop the instance once results are safely in S3. Teardown of everything else is manual
# (scripts/99-teardown.sh --destroy) so results can be collected first.
selfStop=true
