# conf/focused.properties -- read-only re-run concentrating read load onto 15 of the table's
# ~40 partitions, to measure GetItem P99 at a realistic PER-PARTITION utilisation.
#
# Why this run exists. conf/prod.properties spreads readRcu evenly over the whole key space,
# which spreads it evenly over all ~40 partitions: 36,000 / 40 = 900 RCU/s per partition, only
# 30% of the 3,000 RCU/s hard limit. A P99 measured there is a P99 of a lightly-loaded
# partition. This run drives the same 36,000 RCU/s at 15 partitions instead -- 2,400 RCU/s
# each, 80% utilisation -- and reports what the tail looks like when a partition is actually
# working.
#
# It reads the dataset the prod run already loaded (prod-20260910T133019Z, 118 GiB of fixed
# 59 KiB items, created at 40,000 WCU so ~40 partitions, loaded with zero throttles). Hence
# skipLoad below: re-laying that dataset costs ~76 minutes of write capacity to arrive at a
# state the table is already in.

table=latency-test-100g
region=us-east-1
itemCount=2097152

# --- read-only ------------------------------------------------------------------
# Skips CreateTable, the pre-split, the size-model probe (its 100 PutItems would throttle
# against a table sitting at WCU 10) and the LOAD phase; the run starts at SWITCH. Main
# fails fast if the table does not exist, because reads against an empty table return
# misses at ~1 RCU apiece and produce fast, plausible, meaningless numbers.
#
# presplitWcu is deliberately ABSENT and Config rejects it alongside skipLoad: pre-splitting
# buys partitions at CREATE time only, and this run does not create the table. The partition
# count is whatever the loading run established (~40).
skipLoad=true

# --- capacity -------------------------------------------------------------------
# loadWcu is required by Config but INERT under skipLoad=true -- no write phase runs, and
# Main never raises WCU above the 10 the table is already at. Left at the prod value so the
# two configs read the same; it changes nothing here.
loadWcu=30000
readRcu=40000
targetFraction=0.90

# --- read hash-range subsetting -- the point of this run -------------------------
# A parallel Scan's Segment/TotalSegments divides the table into equal, contiguous slices of
# the real hash key space, so segment i of N is a known slice of partitions rather than a
# guess. Restricting the *index* range instead would not work: any subset of indices still
# spreads uniformly across all 40 partitions (measured -- hottest +1.03% for any subset).
#
# readSegmentsTotal=40 matches the ~40 partitions the table was created with (40,000 WCU at
# creation / 1,000 WCU per partition):
#   readRcu x targetFraction / readSegmentsUsed = RCU/s per partition
#   40,000 x 0.90 / 15 = 36,000 / 15 = 2,400 RCU/s per partition, against ~786,432 keys
#   (2,097,152 x 15 / 40) = ~44 GiB of working set, far beyond any cache.
#
# 15 is bounded on both sides: below 12 segments the per-partition rate exceeds the 3,000
# RCU/s hard limit (36,000 / 12 = 3,000 exactly, no headroom; 11 -> 3,273, over) and above
# 17 it falls under the 2,100 RCU/s floor (36,000 / 17 = 2,118; 18 -> 2,000, under).
#
# Margin against the hard limit at 2,400 RCU/s: sigma = sqrt(2400) = 49 RCU/s, so the 3,000
# limit is 12 sigma away. Compare the LOAD phase's 0.47 sigma that actually throttled.
#
# The selector's Scan runs ONCE, after SWITCH and BEFORE either measurement window opens, so
# its own consumed capacity is never counted toward R-A/R-B's achieved-rate or throttle
# numbers. It reads 15/40 x 118 GiB = ~44 GiB and so costs ~5.8M RCU (eventual) = ~145s at
# full provisioned rate; budget a few minutes for it.
readSegmentsTotal=40
readSegmentsUsed=15

# --- timing ---------------------------------------------------------------------
warmSeconds=60
minRampMinutes=5
windowMinutes=20

# --- client ---------------------------------------------------------------------
initialThreads=32
maxThreads=256

resultsDir=/opt/ddblat/results
selfStop=true
