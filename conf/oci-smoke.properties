# conf/oci-smoke.properties -- end-to-end smoke against Oracle's Autonomous AI Database
# API for DynamoDB. Same harness, same item model, same phases as the AWS side.
#
# What differs, and why (measured 2026-09-11 against ADB 26ai):
#   - ConsumedCapacity is never populated, so achieved throughput is derived from the size
#     model instead of from what the service reports. Exact here: fixed 59 KiB items.
#   - The size-model probe is skipped -- with no billed capacity there is nothing to verify
#     predicted capacity against, so it reports NOT APPLICABLE rather than passing.
#   - No EC2 self-stop and no S3 upload: this run is local.
#   - The eventually-consistent read phase is skipped entirely: ADB has no such
#     path, so it would re-measure R-A and mis-bill it at half cost.
#
# Capacity is sized to what this 2-ECPU ADB actually delivers, measured directly:
# ~76 writes/s (8 threads, zero failures) and ~2700 RCU/s of strong reads. Targets
# above that never satisfy the ramp's 95%-of-target gate, so the window never opens.

# ociDatabaseOcid and ociKeyFile are account-specific. scripts/oci/20-deploy.sh
# injects the real values from scripts/oci/.provisioned, so the placeholder below is
# only used if you run the jar by hand.
provider=oci
ociDatabaseOcid=ocid1.autonomousdatabase.oc1.iad.EXAMPLE_REPLACE_ME
ociKeyFile=/home/opc/ddblat-keys.json
region=us-ashburn-1

table=ddblat_smoke
# power of two, required by the full-period read cycle. 4096 x 59 KiB = ~236 MiB.
# Sized so the LOAD window opens before the work runs out: at 90% of 1200 WCU =
# 1080 CU/s = 18 writes/s, 4096 items takes ~224s against a 60s ramp + 60s window.
itemCount=4096

loadWcu=1200
readRcu=1500
targetFraction=0.90

warmSeconds=10
minRampMinutes=1
windowMinutes=1

initialThreads=8
maxThreads=64

resultsDir=/home/opc/results
selfStop=false
