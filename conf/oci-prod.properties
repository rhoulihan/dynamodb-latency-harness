# conf/oci-prod.properties -- production run against Oracle Autonomous AI Database's
# DynamoDB-compatible API, sized for PARITY with the AWS production run.
#
# PARITY IS NOT ATTAINABLE, and that is itself the finding. Oracle's DynamoDB API rejects
# any table whose provisioned capacity exceeds ~9,000 units with
# "ValidationException: Provisioned throughput exceeds maximum capacity".
# Measured on an EMPTY 64-ECPU Autonomous Database: 9,000 accepted, 10,000 / 11,000 / 12,000 /
# 16,000 / 20,000 / 30,000 all rejected. Scaling the database 48 -> 64 ECPU barely moved the
# ceiling, so it is a service cap, not a sizing problem. DynamoDB ran this same test at 40,000.
#
# So the run is at Oracle's own ceiling, and the comparison is stated as a rate ratio:
#   PutItem         8,100 CU/s driven / 59 WCU =  137 writes/s   (AWS: 458,   3.3x more)
#   GetItem strong  8,100 CU/s driven / 15 RCU =  540 reads/s    (AWS: 2,400, 4.4x more)
# Identical item payloads: fixed 59 KiB, 20 attributes, same key space shape.
#
# Dataset is scaled to the achievable write rate so the LOAD window can open and close in a
# sane time: 262,144 items x 59 KiB = 14.8 GiB, ~32 min to load at 137 writes/s. The AWS run's
# 2,097,152 items would take 4.25 hours at this rate.
#
# Client: VM.Standard.E5.Flex 8 OCPU / 32 GB (16 vCPU) in us-ashburn-1 -- the same region as
# the database, mirroring the AWS run's in-AZ EC2 client. Measured in-region: TCP connect
# 0.9 ms, TLS 9 ms, versus 45 ms / 104 ms from a workstation over the internet.
#
# Database: 48 ECPU Autonomous AI Database, Transaction Processing.
#
# Differences from AWS, all forced by the service:
#   - ConsumedCapacity is never populated, so achieved throughput comes from the size model.
#   - The size-model probe is skipped (nothing to verify predicted capacity against).
#   - The eventually-consistent read phase is skipped: ADB has no such path.

# ociDatabaseOcid and ociKeyFile are account-specific. scripts/oci/20-deploy.sh
# injects the real values from scripts/oci/.provisioned, so the placeholder below is
# only used if you run the jar by hand.
provider=oci
ociDatabaseOcid=ocid1.autonomousdatabase.oc1.iad.EXAMPLE_REPLACE_ME
ociKeyFile=/home/opc/ddblat-keys.json
region=us-ashburn-1

table=ddblat_prod
itemCount=262144

loadWcu=9000
readRcu=9000
targetFraction=0.90

warmSeconds=60
minRampMinutes=5
windowMinutes=20

initialThreads=32
maxThreads=256

resultsDir=/home/opc/results
selfStop=false
